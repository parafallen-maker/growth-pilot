project:
  name: growth-pilot
  repo: https://github.com/parafallen-maker/growth-pilot.git
  control_doc: docs/growthpilot/15_多Agent协作任务总文件.md
  source_of_truth:
    - docs/growthpilot/05_数据库DDL.sql
    - docs/growthpilot/07_OpenAPI.yaml
    - docs/growthpilot/06_API文档.md
    - docs/growthpilot/08_页面原型清单.md
    - docs/growthpilot/09_前端开发规格.md
    - docs/growthpilot/10_后端开发规格.md
  execution_policy:
    mode: autonomous-default
    description: 任务类文件进入仓库后默认自动执行，不逐条回头确认；仅在外部动作、不可逆破坏、额外付费、权限/合规不明、范围变更时暂停。
    pause_conditions:
      - external_send
      - destructive_irreversible_action
      - paid_resource_or_budget_change
      - scope_change_beyond_task_file
      - unclear_permission_or_compliance
  branch_policy:
    trunk: main
    agent_branch_pattern: agent/<agent-id>/<task-id>
    integration_branch_pattern: int/<wave>
  status_values: [todo, doing, blocked, review, done]
  priority_values: [P0, P1, P2]

shared_contract:
  handoff_template:
    required_fields:
      - agent
      - module
      - task_id
      - wbs
      - input_docs
      - changed_files
      - output
      - self_check
      - risks
      - next_handoff_to
  done_definition_global:
    - lint_pass
    - type_check_pass
    - docs_aligned
    - no_field_name_drift
    - handoff_written

waves:
  - id: wave-0
    name: 基础定版
    tasks: [T-P0-1, T-P0-2, T-P0-3, T-P0-4]
  - id: wave-1
    name: 基础系统
    tasks: [T-F1-1, T-F1-2, T-F1-3, T-F1-4]
  - id: wave-2
    name: 主数据系统
    tasks: [T-M1-1, T-M1-2, T-M1-3, T-M1-4, T-M1-5]
  - id: wave-3
    name: 作业与成长
    tasks: [T-H1-1, T-H1-2, T-H1-3, T-H1-4, T-H1-5, T-H1-6, T-H1-7, T-G1-1, T-G1-2, T-G1-3, T-G1-4, T-G1-5]
  - id: wave-4
    name: 出勤收费沟通
    tasks: [T-A1-1, T-A1-2, T-A1-3, T-B1-1, T-B1-2, T-B1-3, T-C1-1, T-C1-2]
  - id: wave-5
    name: 分析迁移验收上线
    tasks: [T-BI1-1, T-BI1-2, T-DM1-1, T-DM1-2, T-QA1-1, T-QA1-2]

