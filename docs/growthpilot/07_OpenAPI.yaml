openapi: 3.1.0
info:
  title: 洪基托管成长中心后台系统 API
  version: v1.0.0
  description: 移除法律合规和心理筛查后的核心后台 API 设计稿。
servers:
- url: https://api.hongji-growth.local/api/v1
  description: Design Server
tags:
- name: auth
  description: 认证
- name: settings
  description: 校区、学期、字典
- name: users
  description: 用户与角色
- name: teachers
  description: 教师管理
- name: students
  description: 学生主档与在读档
- name: families
  description: 家庭与监护人
- name: files
  description: 文件上传与元数据
- name: homework
  description: 作业上传、AI、教师复核
- name: growth
  description: 成长观察、目标、报告
- name: attendance
  description: 签到、设备、作业时长
- name: billing
  description: 产品、合同、账单、支付
- name: communication
  description: 沟通记录与消息
- name: analytics
  description: 看板分析
- name: jobs
  description: 异步任务
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    studentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    familyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    teacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    goalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    invoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    pageNo:
      name: pageNo
      in: query
      schema:
        type: integer
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
    keyword:
      name: keyword
      in: query
      schema:
        type: string
    campusId:
      name: campusId
      in: query
      schema:
        type: string
        format: uuid
    termId:
      name: termId
      in: query
      schema:
        type: string
        format: uuid
    status:
      name: status
      in: query
      schema:
        type: string
    sortBy:
      name: sortBy
      in: query
      schema:
        type: string
    sortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data: {}
        traceId:
          type: string
    PageResultMeta:
      type: object
      properties:
        pageNo:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PageResultOfAny:
      type: object
      properties:
        list:
          type: array
          items: {}
        page:
          $ref: '#/components/schemas/PageResultMeta'
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    CurrentUserResponse:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          permissions:
            type: array
            items:
              type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        campusIds:
          type: array
          items:
            type: string
            format: uuid
    Campus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
    Term:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
    Teacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        employeeNo:
          type: string
        name:
          type: string
        mobile:
          type: string
        leadSubject:
          type: string
        status:
          type: string
    Student:
      type: object
      required:
      - studentNo
      - name
      - gradeLabel
      properties:
        id:
          type: string
          format: uuid
        studentNo:
          type: string
        name:
          type: string
        gender:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        schoolName:
          type: string
        gradeLabel:
          type: string
        className:
          type: string
        familyId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
    CreateStudentRequest:
      type: object
      required:
      - studentNo
      - name
      - gradeLabel
      properties:
        studentNo:
          type: string
        name:
          type: string
        gender:
          type: string
        birthDate:
          type: string
          format: date
        schoolName:
          type: string
        gradeLabel:
          type: string
        className:
          type: string
        familyId:
          type: string
          format: uuid
        photoFileId:
          type: string
          format: uuid
        profileNotes:
          type: string
        tags:
          type: array
          items:
            type: string
        outsideCourses:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCourse'
    ExternalCourse:
      type: object
      properties:
        subject:
          type: string
        institutionName:
          type: string
        scheduleNote:
          type: string
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        primaryTeacherId:
          type: string
          format: uuid
          nullable: true
        groupId:
          type: string
          format: uuid
          nullable: true
        enrollDate:
          type: string
          format: date
        leaveDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
    CreateEnrollmentRequest:
      type: object
      required:
      - campusId
      - termId
      - enrollDate
      properties:
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        primaryTeacherId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        enrollDate:
          type: string
          format: date
        leaveDate:
          type: string
          format: date
        leaveReason:
          type: string
        status:
          type: string
          default: active
    Family:
      type: object
      properties:
        id:
          type: string
          format: uuid
        familyCode:
          type: string
        familyName:
          type: string
        primaryContactName:
          type: string
        primaryMobile:
          type: string
        familyStructure:
          type: string
        status:
          type: string
    CreateFamilyRequest:
      type: object
      properties:
        familyCode:
          type: string
        familyName:
          type: string
        primaryContactName:
          type: string
        primaryMobile:
          type: string
        secondaryMobile:
          type: string
        familyStructure:
          type: string
        address:
          type: string
        communicationPreference:
          type: string
        notes:
          type: string
    Guardian:
      type: object
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        name:
          type: string
        relation:
          type: string
        mobile:
          type: string
        isPrimary:
          type: boolean
        isEmergency:
          type: boolean
    CreateGuardianRequest:
      type: object
      required:
      - name
      - relation
      properties:
        name:
          type: string
        relation:
          type: string
        mobile:
          type: string
        wechatId:
          type: string
        email:
          type: string
        occupation:
          type: string
        isPrimary:
          type: boolean
        isEmergency:
          type: boolean
        notes:
          type: string
    HomeworkSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        submissionNo:
          type: string
        studentId:
          type: string
          format: uuid
        subject:
          type: string
        homeworkDate:
          type: string
          format: date
        aiStatus:
          type: string
        reviewStatus:
          type: string
        finalAccuracyPct:
          type: number
          format: double
          nullable: true
        finalErrorSummary:
          type: string
          nullable: true
    CreateHomeworkSubmissionRequest:
      type: object
      required:
      - studentId
      - subject
      - homeworkDate
      - fileIds
      properties:
        studentId:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        subject:
          type: string
        homeworkDate:
          type: string
          format: date
        fileIds:
          type: array
          items:
            type: string
            format: uuid
        sourceType:
          type: string
          default: teacher_upload
        remark:
          type: string
    TriggerAnalysisRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
        provider:
          type: string
        modelName:
          type: string
        promptVersion:
          type: string
    HomeworkReviewRequest:
      type: object
      required:
      - reviewResult
      properties:
        reviewResult:
          type: string
          enum:
          - approved
          - adjusted
          - rejected
        finalAccuracyPct:
          type: number
          format: double
        finalErrorItems:
          type: array
          items:
            type: object
            properties:
              errorTaxonomyId:
                type: string
                format: uuid
              weight:
                type: number
                format: double
              note:
                type: string
        finalErrorSummary:
          type: string
        finalSuggestion:
          type: string
        publishToFamily:
          type: boolean
    RubricDimension:
      type: object
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        weight:
          type: number
        scoreMin:
          type: integer
        scoreMax:
          type: integer
        description:
          type: string
        sortOrder:
          type: integer
    RubricTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        name:
          type: string
        stageScope:
          type: string
        status:
          type: string
        description:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/RubricDimension'
    CreateRubricRequest:
      type: object
      required:
      - name
      properties:
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        name:
          type: string
        stageScope:
          type: string
        description:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/RubricDimension'
    GrowthObservationRequest:
      type: object
      required:
      - studentId
      - observationDate
      - templateId
      - scores
      properties:
        studentId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        observationDate:
          type: string
          format: date
        scene:
          type: string
        scores:
          type: array
          items:
            type: object
            properties:
              dimensionId:
                type: string
                format: uuid
              score:
                type: number
                format: double
              note:
                type: string
        strengths:
          type: string
        improvementNotes:
          type: string
        publishToFamily:
          type: boolean
    GrowthGoal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        goalType:
          type: string
        title:
          type: string
        status:
          type: string
        targetValue:
          type: number
          format: double
          nullable: true
        currentValue:
          type: number
          format: double
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
    CreateGrowthGoalRequest:
      type: object
      required:
      - studentId
      - goalType
      - title
      properties:
        studentId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        goalType:
          type: string
        title:
          type: string
        description:
          type: string
        ownerRole:
          type: string
        metricType:
          type: string
        baselineValue:
          type: number
          format: double
        targetValue:
          type: number
          format: double
        currentValue:
          type: number
          format: double
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          type: string
          default: draft
    GoalCheckinRequest:
      type: object
      required:
      - checkinDate
      properties:
        checkinDate:
          type: string
          format: date
        progressValue:
          type: number
          format: double
        progressNote:
          type: string
        nextAction:
          type: string
    GrowthReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        reportType:
          type: string
        periodKey:
          type: string
        status:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
    GenerateReportRequest:
      type: object
      required:
      - reportType
      - periodKey
      - studentIds
      properties:
        reportType:
          type: string
          enum:
          - weekly
          - monthly
        periodKey:
          type: string
        studentIds:
          type: array
          items:
            type: string
            format: uuid
        termId:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
    AttendanceEventRequest:
      type: object
      required:
      - studentId
      - campusId
      - eventType
      - eventTime
      properties:
        studentId:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        eventType:
          type: string
        eventTime:
          type: string
          format: date-time
        remark:
          type: string
    DeviceBindingRequest:
      type: object
      required:
      - studentId
      - deviceId
      properties:
        studentId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
    BillingProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string
        billingMode:
          type: string
        priceCents:
          type: integer
        status:
          type: string
    CreateBillingProductRequest:
      type: object
      required:
      - code
      - name
      - category
      - billingMode
      - priceCents
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        billingMode:
          type: string
        priceCents:
          type: integer
        unit:
          type: string
        description:
          type: string
    CreateContractRequest:
      type: object
      required:
      - contractNo
      - familyId
      - studentId
      - signDate
      - startDate
      - endDate
      - items
      properties:
        contractNo:
          type: string
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        signDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        discountAmountCents:
          type: integer
        remark:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              itemName:
                type: string
              unitPriceCents:
                type: integer
              quantity:
                type: number
                format: double
    CreateInvoiceRequest:
      type: object
      required:
      - invoiceNo
      - familyId
      - studentId
      - issueDate
      - amountCents
      properties:
        invoiceNo:
          type: string
        contractId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        billingPeriod:
          type: string
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        amountCents:
          type: integer
        note:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              itemName:
                type: string
              productId:
                type: string
                format: uuid
              quantity:
                type: number
                format: double
              unitPriceCents:
                type: integer
              amountCents:
                type: integer
    PaymentRequest:
      type: object
      required:
      - paymentNo
      - paidAmountCents
      - paymentTime
      - channel
      properties:
        paymentNo:
          type: string
        paidAmountCents:
          type: integer
        paymentTime:
          type: string
          format: date-time
        channel:
          type: string
        transactionNo:
          type: string
        remark:
          type: string
    RefundRequest:
      type: object
      required:
      - refundNo
      - refundAmountCents
      - refundTime
      properties:
        refundNo:
          type: string
        refundAmountCents:
          type: integer
        refundTime:
          type: string
          format: date-time
        reason:
          type: string
    CommunicationRecordRequest:
      type: object
      required:
      - familyId
      - channel
      - direction
      - summary
      properties:
        familyId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        channel:
          type: string
        direction:
          type: string
        topic:
          type: string
        summary:
          type: string
        nextAction:
          type: string
    MessageRequest:
      type: object
      required:
      - familyId
      - channel
      - body
      properties:
        templateId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        channel:
          type: string
        subject:
          type: string
        body:
          type: string
        scheduledAt:
          type: string
          format: date-time
    JobStatus:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        jobType:
          type: string
        bizType:
          type: string
        bizId:
          type: string
          format: uuid
        status:
          type: string
        progress:
          type: integer
        result:
          type: object
          additionalProperties: true
        errorMessage:
          type: string
          nullable: true
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: 刷新 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
  /auth/me:
    get:
      tags:
      - auth
      summary: 当前用户
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUserResponse'
  /auth/logout:
    post:
      tags:
      - auth
      summary: 退出登录
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /settings/campuses:
    get:
      tags:
      - settings
      summary: 校区列表
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '#/components/schemas/Campus'
                        page:
                          $ref: '#/components/schemas/PageResultMeta'
  /settings/terms:
    get:
      tags:
      - settings
      summary: 学期列表
      parameters:
      - $ref: '#/components/parameters/campusId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '#/components/schemas/Term'
                        page:
                          $ref: '#/components/schemas/PageResultMeta'
  /settings/dictionaries:
    get:
      tags:
      - settings
      summary: 字典列表
      parameters:
      - name: dictType
        in: query
        schema:
          type: string
